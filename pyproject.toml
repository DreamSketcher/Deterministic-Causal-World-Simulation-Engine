[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-world"
version = "0.1.0"
description = "Deterministic Causal World Simulation Engine: minimal executable kernel (world state, atomic transitions, addressable randomness, causal index, read-only observers)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DreamSketcher" }]
keywords = ["simulation", "determinism", "causality", "world-model"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Life",
]

[project.scripts]
causal-world = "causal_world.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
